groups:
  - name: node-alerts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Node exporter is unavailable
      - alert: HostHighCpu
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage exceeds 90 percent
      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/var/lib",fstype!~"tmpfs|overlay|rootfs"} / node_filesystem_size_bytes{mountpoint=~"/|/var/lib",fstype!~"tmpfs|overlay|rootfs"} * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host data filesystem has less than 10 percent free space
