global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          instance: devops-runner
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels:
          origin: practice2
          release: devops
