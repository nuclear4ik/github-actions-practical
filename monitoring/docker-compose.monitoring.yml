name: monitoring
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [monitoring_net, app_net, mattermost_network]
    restart: unless-stopped
  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:?Create the Mattermost incoming webhook}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring_net, mattermost_network]
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    command: [--path.rootfs=/host]
    pid: host
    volumes:
      # Docker Desktop does not expose a shared/slave root mount.
      - /:/host:ro
    networks: [monitoring_net]
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:0.61.1
    container_name: cadvisor
    command: [--docker_only=true, --housekeeping_interval=15s]
    cgroup: host
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring_net]
    restart: unless-stopped
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: "app-db:5432/${APP_DB_NAME:?Set APP_DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD}
    networks: [monitoring_net, app_net]
    restart: unless-stopped
networks:
  monitoring_net:
    name: monitoring_net
  app_net:
    external: true
    name: ${APP_NETWORK:-docker-fullstack_app_net}
  mattermost_network:
    external: true
    name: mattermost_network
volumes:
  prometheus_data:
  grafana_data:
