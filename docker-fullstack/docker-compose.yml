# version в Compose v2 не нужен: поле устарело и игнорируется.
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Явный тег вместо latest: в проде «плавающий» тег не говорит, что именно запущено.
    image: app-backend:1.0.0
    container_name: app
    ports:
      # Оба числа из APP_PORT: секрет задаёт и порт на хосте, и порт процесса.
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      HTTP_PORT: ${APP_PORT:-8080}
      STATIC_DIR: /app/static
      # Имя сервиса db — это DNS внутри сети Compose, не localhost.
      # В CI значение приходит из секрета DB_HOST и должно остаться db.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-appdb}
    # Фронтенд монтируется с хоста только на чтение: контейнер не может его изменить.
    volumes:
      - ./frontend:/app/static:ro
    depends_on:
      db:
        # Ждём готовности БД, а не только старта контейнера.
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-appdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      # SQL первого запуска: таблица и две записи.
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    # Порт 5432 наружу не публикуем: база видна только в сети app_net.
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
