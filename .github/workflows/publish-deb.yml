name: Build Publish and Verify syspulse
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: syspulse-release
  cancel-in-progress: false
jobs:
  build-publish-verify:
    runs-on: [self-hosted, devops-practices]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary and package deb
        run: bash syspulse/scripts/build.sh
      - name: Publish to Nexus hosted APT
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: bash syspulse/scripts/publish.sh
      - name: Load repository public key
        env:
          NEXUS_APT_PUBLIC_KEY: ${{ secrets.NEXUS_APT_PUBLIC_KEY }}
        run: |
          test -n "$NEXUS_APT_PUBLIC_KEY"
          printf '%s' "$NEXUS_APT_PUBLIC_KEY" | base64 --decode > nexus/public.gpg
      - name: Install with apt in clean Ubuntu amd64
        run: |
          mkdir -p evidence/practice5
          set -o pipefail
          bash syspulse/scripts/verify.sh 2>&1 | tee evidence/practice5/apt-install.log
      - name: Save package and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syspulse-deb-${{ github.run_id }}
          path: |
            syspulse/dist/*.deb
            syspulse/dist/SHA256SUMS
            evidence/practice5/apt-install.log
          retention-days: 30
